[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

testpaths = tests

addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    -p no:warnings

markers =
    unit: Unit tests (fast, no server needed)
    integration: Integration tests (requires server)
    slow: Slow tests (over 10 seconds)

asyncio_mode = auto

log_cli = false
log_cli_level = INFO
